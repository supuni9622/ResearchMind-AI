groups:
  - name: researchmind.rules
    rules:
      - alert: ResearchMindHighApiErrorRate
        expr: |
          sum(rate(researchmind_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(researchmind_http_requests_total[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: ResearchMind API error rate is above 5%

      - alert: ResearchMindHighGenerationFailureRate
        expr: |
          sum(rate(researchmind_generation_failures_total[10m]))
          /
          clamp_min(sum(rate(researchmind_generation_requests_total[10m])), 1)
          > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Generation failure rate is above 10%

      - alert: ResearchMindHighWebSearchFailureRate
        expr: |
          sum(rate(researchmind_web_search_failures_total[10m]))
          /
          clamp_min(sum(rate(researchmind_web_search_requests_total[10m])), 1)
          > 0.20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Web search failure rate is above 20%

      - alert: ResearchMindHighMcpFailureRate
        expr: |
          sum(rate(researchmind_mcp_tool_failures_total[10m]))
          /
          clamp_min(sum(rate(researchmind_mcp_tool_requests_total[10m])), 1)
          > 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: MCP tool failure rate is above 15%

      - alert: ResearchMindUnexpectedMemoryExtractionRate
        expr: |
          sum(rate(researchmind_memory_extraction_requested_total[30m]))
          /
          clamp_min(
            sum(rate(researchmind_memory_extraction_evaluated_total[30m])),
            1
          )
          > 0.70
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Memory extraction runs for more than 70% of evaluated turns

      - alert: ResearchMindMemoryLifecycleStale
        expr: |
          (time() - researchmind_memory_lifecycle_last_success_timestamp_seconds > 108000)
          or absent(researchmind_memory_lifecycle_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Memory lifecycle has not completed successfully for 30h

      - alert: ResearchMindMemoryLifecycleFailures
        expr: |
          sum(increase(researchmind_memory_lifecycle_failed_total[1h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Memory lifecycle row failures occurred during the last hour

      - alert: ResearchMindMemoryVectorDrift
        expr: |
          sum(researchmind_memory_vector_drift) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL and Qdrant memory IDs have drifted

      - alert: ResearchMindMemoryInventoryStale
        expr: |
          (time() - researchmind_memory_inventory_last_success_timestamp_seconds > 108000)
          or absent(researchmind_memory_inventory_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Memory storage inventory has not completed successfully for 30h

      # Latency-SLO alerts (EVALUATION_IMPLEMENTATION_TRACKER.md E17,
      # PRODUCTION_READINESS_EVALUATION.md item 2). Thresholds are
      # documented starting points, not calibrated against real production
      # traffic yet -- no live percentile data existed to calibrate
      # against when these were written (in-process Prometheus counters
      # reset on every API restart in local dev, so there was nothing
      # accumulated to check against). Revisit once real volume exists,
      # same "not yet calibrated" caveat this project already applies to
      # every other regression threshold in benchmarks/regression/thresholds.py.
      #
      # Per-surface, not per-pipeline-stage (retrieval/rerank have no
      # dedicated latency histogram to alert on yet).
      - alert: ResearchMindChatLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(researchmind_generation_duration_seconds_bucket{runtime="chat"}[10m])) by (le)
          ) > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Chat P95 generation latency is above 15s

      - alert: ResearchMindLinearResearchLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(researchmind_research_duration_seconds_bucket{source_mode="linear"}[10m])) by (le)
          ) > 45
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Linear Research P95 turn latency is above 45s

      # Deep Research (EVALUATION_IMPLEMENTATION_TRACKER.md E17 follow-up)
      # -- a genuinely different KIND of alert from the two above, not
      # just a bigger number: `researchmind_deep_research_run_duration_seconds`
      # measures `completed_at - started_at`, which legitimately includes
      # human-approval wait time at the plan/report/web-search checkpoints
      # (real, expected latency this alert can't distinguish from a
      # stuck/orphaned run). A 1h rate window + 30m `for` (vs. the 10m
      # above) since Deep Research completions are comparatively rare --
      # a tighter window would mostly evaluate against too few samples to
      # mean anything. 2h is a conservative, undercalibrated starting
      # bound (no real production volume existed to calibrate against
      # when this was written, same caveat as the two alerts above) --
      # revisit once real usage data exists to separate "normal human
      # review latency" from "actually stuck."
      - alert: ResearchMindDeepResearchRunAbnormallySlow
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(researchmind_deep_research_run_duration_seconds_bucket[1h])) by (le)
          ) > 7200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Deep Research P95 end-to-end run duration is above 2h
